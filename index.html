<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle-section">
          <span class="label">TEMA</span>
          <label class="theme-toggle" for="theme-switch">
            <input type="checkbox" id="theme-switch" />
            <span class="theme-toggle-track">
              <span class="theme-toggle-thumb"></span>
            </span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records-panel">
          <p class="records-heading">🏆 Top 5</p>
          <ol id="start-records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="start-max-lines">0</strong></span>
          </div>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="link-btn">Resetear records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="save-score-section" class="hidden">
          <p class="new-record-label">¡Nuevo record! Ingresa tu nombre:</p>
          <div class="save-score-row">
            <input type="text" id="player-name" maxlength="10" placeholder="JUGADOR" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>

        <div id="gameover-records-panel" class="records-panel hidden">
          <p class="records-heading">🏆 Top 5</p>
          <ol id="gameover-records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="gameover-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="gameover-max-lines">0</strong></span>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
