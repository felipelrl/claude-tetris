<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle-section">
          <span class="label">TEMA</span>
          <label class="theme-toggle" for="theme-switch">
            <input type="checkbox" id="theme-switch" />
            <span class="theme-toggle-track">
              <span class="theme-toggle-thumb"></span>
            </span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section highscores-section">
          <span class="label">RECORDS</span>
          <ol id="panel-highscores-list" class="highscores-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="panel-best-combo">0</strong></span>
            <span>Máx líneas: <strong id="panel-max-lines">0</strong></span>
          </div>
          <button id="reset-scores-btn" class="btn btn-secondary">Reset Records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="gameover-name-entry" class="hidden">
          <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="save-score-btn" class="btn">Guardar</button>
        </div>

        <button id="restart-btn">Reiniciar</button>

        <div id="gameover-highscores" class="hidden">
          <ol id="overlay-highscores-list" class="highscores-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="overlay-best-combo">0</strong></span>
            <span>Máx líneas: <strong id="overlay-max-lines">0</strong></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
